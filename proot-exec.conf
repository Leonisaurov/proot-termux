# proot-exec.conf — perfil declarativo equivalente al modo termux-paths de
# codex-linux-sandbox.
#
# Uso desde la raíz del repositorio:
#   ./proot/bin/proot-exec --config ./proot-exec.conf --print
#   ./proot/bin/proot-exec --config ./proot-exec.conf
# proot-exec elimina por sí mismo LD_PRELOAD y LD_LIBRARY_PATH antes de lanzar
# PRoot.
#
# Este archivo reproduce la política fija del wrapper: PREFIX y HOME RO,
# workspace y temporales RW, carveouts de credenciales, /proc aislado y el
# conjunto de flags de hardening. ${PWD} es el workspace de la invocación.
# Para otro workspace, ejecútalo con PWD apuntando a ese directorio o copia el
# archivo y ajusta el bind correspondiente.

[proot]
executable = "${PREFIX}/bin/proot"
cwd = "${PWD}"
launcher_cwd = "${PWD}"
net_policy = "off"
control_fd = "none"
inherit_environment = true
flags = [
  "--kill-on-exit",
  "--proc-isolated",
  "--ptrace-isolated",
  "--bpf-isolated",
  "--perf-isolated",
  "--handle-isolated",
  "--reboot-isolated",
  "--swap-isolated",
  "--kexec-isolated",
  "--ioport-isolated",
]
extra_args = ["--change-id=0:0", "--link2symlink"]
command = ["${PREFIX}/bin/sh", "-i"]

# El sistema Android que bionic necesita para resolver librerías.
[[binds]]
host = "/system"
guest = "/system"
mode = "ro"

[[binds]]
host = "/vendor"
guest = "/vendor"
mode = "ro"

[[binds]]
host = "/apex"
guest = "/apex"
mode = "ro"

[[binds]]
host = "/linkerconfig/ld.config.txt"
guest = "/linkerconfig/ld.config.txt"
mode = "ro"

# Modelo termux-paths: las rutas guest conservan el prefijo real de Termux.
[[binds]]
host = "${PREFIX}"
guest = "${PREFIX}"
mode = "ro"

[[binds]]
host = "${HOME}"
guest = "${HOME}"
mode = "ro"

# Carveouts de Codex: el último bind gana y tapa el contenido del HOME.
# Los directorios fuente son fixtures vacíos versionados junto a este perfil.
[[binds]]
host = "proot/examples/proot-exec/codex-hidden/.ssh"
guest = "${HOME}/.ssh"
mode = "ro"

[[binds]]
host = "proot/examples/proot-exec/codex-hidden/.codex"
guest = "${HOME}/.codex"
mode = "ro"

# El wrapper real vuelve a exponer solo estas dos subrutas de ~/.codex.
[[binds]]
host = "${HOME}/.codex/shell_snapshots"
guest = "${HOME}/.codex/shell_snapshots"
mode = "ro"

[[binds]]
host = "${HOME}/.codex/skills"
guest = "${HOME}/.codex/skills"
mode = "ro"

[[binds]]
host = "proot/examples/proot-exec/codex-hidden/.aws"
guest = "${HOME}/.aws"
mode = "ro"

[[binds]]
host = "proot/examples/proot-exec/codex-hidden/.config/gh"
guest = "${HOME}/.config/gh"
mode = "ro"

[[binds]]
host = "proot/examples/proot-exec/codex-hidden/.netrc"
guest = "${HOME}/.netrc"
mode = "ro"

# Workspace y temporales: equivalen al workspace RW y a TMPDIR RW del wrapper.
[[binds]]
host = "${PWD}"
guest = "${PWD}"
mode = "rw"

[[binds]]
host = "${TMPDIR}"
guest = "${TMPDIR}"
mode = "rw"

# El permission-profile de Codex suele pedir special slash_tmp.
[[binds]]
host = "${TMPDIR}"
guest = "/tmp"
mode = "rw"

# PRoot necesita estos mounts explícitos en Termux. /sys queda sin exponer,
# igual que en codex-linux-sandbox.
[[binds]]
host = "/dev"
guest = "/dev"
mode = "rw"

[[binds]]
host = "/proc"
guest = "/proc"
mode = "rw"
