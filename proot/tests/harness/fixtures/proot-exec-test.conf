[proot]
executable = "${PREFIX}/bin/proot"
cwd = "/"
net_policy = "deny"
net_allow = ["*"]
proxy = "proot-exec-test"
control_fd = "none"
inherit_environment = true
flags = ["--kill-on-exit"]
command = ["${PREFIX}/bin/sh", "-c", "test -d /proot-exec-test-tmp && printf PROOT_EXEC_CONFIG_OK"]

[[binds]]
host = "${PREFIX}/tmp"
guest = "/proot-exec-test-tmp"
mode = "ro"

[env]
PROOT_EXEC_TEST = "configured"
