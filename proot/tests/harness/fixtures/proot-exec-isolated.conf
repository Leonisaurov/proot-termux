# Stable Termux-paths fixture, independent of personal configuration files.
[proot]
executable = "${PREFIX}/bin/proot"
cwd = "${PWD}"
launcher_cwd = "${PWD}"
net_policy = "off"
control_fd = "none"
inherit_environment = true
flags = ["--kill-on-exit", "--proc-isolated", "--ptrace-isolated",
         "--bpf-isolated", "--perf-isolated", "--handle-isolated",
         "--reboot-isolated", "--swap-isolated", "--kexec-isolated", "--ioport-isolated"]
extra_args = ["--change-id=0:0", "--link2symlink"]
command = ["${PREFIX}/bin/sh", "-c", "printf PROOT_EXEC_MAIN_PROFILE_OK"]

[[binds]]
host = "${PREFIX}"
guest = "${PREFIX}"
mode = "ro"

[[binds]]
host = "${HOME}"
guest = "${HOME}"
mode = "ro"

[[binds]]
host = "${PWD}"
guest = "${PWD}"
mode = "rw"

[[binds]]
host = "${TMPDIR}"
guest = "${TMPDIR}"
mode = "rw"

# Explicit guest alias for nested Linux tools; host temporaries remain TMPDIR.
[[binds]]
host = "${TMPDIR}"
guest = "/tmp"
mode = "rw"

[[binds]]
host = "/dev"
guest = "/dev"
mode = "rw"

[[binds]]
host = "/proc"
guest = "/proc"
mode = "rw"
