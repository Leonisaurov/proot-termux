name: Build proot

# ----- Trigger configuration -----
on:
  push:
    paths:
      - 'proot/ci/termux/packages/proot/**'
      - 'proot/ci/termux/packages/libtalloc/**'
      - 'proot/ci/termux/packages/libandroid-shmem/**'
      - 'proot/ci/termux/scripts/linux-kernel-signing-keys.gpg'
      - 'proot/ci/termux/scripts/profile-restricted.apparmor'
      - 'proot/src/**'
      - 'proot/scripts/**'
      - 'proot/ci/termux/scripts/build/**'
      - 'proot/ci/termux/scripts/properties.sh'
      - '.github/workflows/build-proot.yml'
      - '.github/actions/zram/action.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ----- Job configuration -----
jobs:
  build:
    outputs:
      release_tag: ${{ steps.package-meta.outputs.release_tag }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Resolve package release identity
      id: package-meta
      shell: bash
      run: |
        set -euo pipefail
        package_file='proot/ci/termux/packages/proot/build.sh'
        version=$(sed -n 's/^TERMUX_PKG_VERSION="\([^"]*\)"$/\1/p' "$package_file")
        revision=$(sed -n 's/^TERMUX_PKG_REVISION=\([0-9][0-9]*\)$/\1/p' "$package_file")
        test -n "$version" -a -n "$revision"
        echo "release_tag=proot-${version}-${revision}" >> "$GITHUB_OUTPUT"

    - name: Enable zram swap
      id: zram
      continue-on-error: true
      uses: ./.github/actions/zram
      with:
        algorithm: zstd
        size: 16G
        priority: 100
        device_name: /dev/zram0

    - name: Report zram fallback
      if: steps.zram.outcome == 'failure'
      run: echo '::warning::zram could not be enabled; continuing without optional zram swap.'

    # ----- Cache build dependencies -----
    - name: Restore build cache
      uses: actions/cache@v4
      id: build-cache
      with:
        path: ~/.termux-build
        key: proot-v2-${{ runner.os }}-aarch64-${{ hashFiles('proot/ci/termux/scripts/properties.sh', 'proot/ci/termux/scripts/build/**', 'proot/ci/termux/packages/proot/build.sh', 'proot/ci/termux/packages/libtalloc/build.sh', 'proot/ci/termux/packages/libandroid-shmem/build.sh') }}
        restore-keys: |
          proot-v2-${{ runner.os }}-aarch64-

    - name: Prepare cache directory
      run: mkdir -p ~/.termux-build

    # ----- Build proot package -----
    - name: Build proot package
      env:
        TERMUX_DOCKER_RUN_EXTRA_ARGS: --volume /home/runner/.termux-build:/home/builder/.termux-build
      run: ./proot/ci/termux/scripts/run-docker.sh ./proot/ci/termux/build-package.sh -I -a aarch64 --format pacman proot

    # ----- Collect and upload proot/artifacts -----
    - name: Collect package files
      env:
        RELEASE_TAG: ${{ steps.package-meta.outputs.release_tag }}
      run: |
        set -euo pipefail
        mkdir -p ./proot/artifacts
        package="proot/ci/termux/output/${RELEASE_TAG}-aarch64.pkg.tar.xz"
        test -s "$package"
        xz -t "$package"
        tar -xOf "$package" .PKGINFO > proot/artifacts/package-info.txt
        grep -Fx 'pkgname = proot' proot/artifacts/package-info.txt
        grep -Fx 'arch = aarch64' proot/artifacts/package-info.txt
        grep -Fx "pkgver = ${RELEASE_TAG#proot-}" proot/artifacts/package-info.txt
        cp "$package" proot/artifacts/
        cd proot/artifacts
        sha256sum "${RELEASE_TAG}-aarch64.pkg.tar.xz" > SHA256SUMS

    - name: Store package files as artifact
      uses: actions/upload-artifact@v6
      with:
        name: proot-aarch64-${{ github.sha }}
        path: ./proot/artifacts/*
        if-no-files-found: error

  release:
    needs: build
    if: needs.build.result == 'success' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Download package artifact
      uses: actions/download-artifact@v4
      with:
        name: proot-aarch64-${{ github.sha }}
        path: proot/artifacts

    - name: Upload to GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      run: |
        set -euo pipefail
        cd proot/artifacts
        sha256sum -c SHA256SUMS
        FILE="${RELEASE_TAG}-aarch64.pkg.tar.xz"
        [ -f "$FILE" ] || { echo 'No package artifact found' >&2; exit 1; }
        TAG="$RELEASE_TAG"
        if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          gh release upload "$TAG" "$FILE" \
            --repo "${{ github.repository }}" \
            --clobber
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --latest \
            --notes "proot aarch64 from ${{ github.sha }}"
        else
          gh release create "$TAG" "$FILE" \
            --target "${{ github.sha }}" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --latest \
            --notes "proot aarch64 from ${{ github.sha }}"
        fi
