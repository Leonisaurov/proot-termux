name: Build proot

# ----- Trigger configuration -----
on:
  push:
    paths:
      - 'ci/termux/packages/proot/**'
      - 'ci/termux/packages/libtalloc/**'
      - 'ci/termux/packages/libandroid-shmem/**'
      - 'ci/termux/scripts/linux-kernel-signing-keys.gpg'
      - 'proot-source/**'
      - '.github/actions/zram/action.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ----- Job configuration -----
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Enable zram swap
      id: zram
      continue-on-error: true
      uses: ./.github/actions/zram
      with:
        algorithm: zstd
        size: 16G
        priority: 100
        device_name: /dev/zram0

    - name: Report zram fallback
      if: steps.zram.outcome == 'failure'
      run: echo '::warning::zram could not be enabled; continuing without optional zram swap.'

    # ----- Cache build dependencies -----
    - name: Restore build cache
      uses: actions/cache@v4
      id: build-cache
      with:
        path: ~/.termux-build
        key: proot-${{ hashFiles('ci/termux/packages/proot/build.sh', 'ci/termux/packages/libtalloc/build.sh', 'ci/termux/packages/libandroid-shmem/build.sh') }}
        restore-keys: |
          proot-

    - name: Prepare cache directory
      run: mkdir -p ~/.termux-build

    # ----- Build proot package -----
    - name: Build proot package
      env:
        TERMUX_DOCKER_RUN_EXTRA_ARGS: --volume /home/runner/.termux-build:/home/builder/.termux-build
      run: ./ci/termux/scripts/run-docker.sh ./ci/termux/build-package.sh -I -a aarch64 --format pacman proot

    # ----- Collect and upload artifacts -----
    - name: Collect package files
      if: always()
      run: |
        mkdir -p ./artifacts
        mv ci/termux/output/*.pkg.tar.xz ./artifacts/ 2>/dev/null || true

    - name: Store package files as artifact
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: proot-aarch64-${{ github.sha }}
        path: ./artifacts/*
        if-no-files-found: warn

  release:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Download package artifact
      uses: actions/download-artifact@v4
      with:
        name: proot-aarch64-${{ github.sha }}
        path: artifacts

    - name: Upload to GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        FILE=$(find artifacts -maxdepth 1 -type f -name '*.pkg.tar.xz' -print -quit)
        [ -f "$FILE" ] || { echo 'No package artifact found' >&2; exit 1; }
        gh release delete proot-latest --yes --cleanup-tag 2>/dev/null || true
        gh release create proot-latest "$FILE" \
          --repo "${{ github.repository }}" \
          --title "proot-latest" \
          --latest \
          --notes "proot aarch64 from ${{ github.sha }}"
