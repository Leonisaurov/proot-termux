# zram — compressed RAM-based swap for GitHub Actions runners
#
# zram creates a compressed block device in RAM used as swap space.
# This allows the system to handle memory pressure via compression
# instead of disk I/O, significantly improving build performance on
# memory-constrained runners without adding disk latency.
name: zram
description: Enable zram module on GitHub hosted runner

branding:
  icon: activity
  color: green

inputs:
  algorithm:
    description: The compression algorithm to use with zram
    default: zstd
  size:
    description: Maximum amount of memory to store in compressed form
    default: 16G
  priority:
    description: Priority of swap device (0-32767)
    default: '100'
  device_name:
    description: Name of swap device
    default: '/dev/zram0'

runs:
  using: composite
  steps:
    - name: Extract VM kernel version for module compilation
      id: kernel-info
      shell: bash
      run: |
        set -euo pipefail
        # We need to use the full kernel version instead of just the kernel version for caching the zram module as
        # GitHub Actions seems to have two different kernels with the same version but different patch versions
        # which are not compatible with each other.
        # For example 6.17.0-1010-azure and 6.17.0-1030-azure
        FULL_KERNEL_VERSION="$(uname -r)"
        KERNEL_VERSION="$(grep -o "^[0-9\\.]*" <<< "${FULL_KERNEL_VERSION}")"
        TAR_KERNEL_VERSION="${KERNEL_VERSION%\.0}"

        echo "full_kernel_version=${FULL_KERNEL_VERSION}" >> "$GITHUB_OUTPUT"
        echo "kernel_version=${KERNEL_VERSION}" >> "$GITHUB_OUTPUT"
        echo "tar_version=${TAR_KERNEL_VERSION}" >> "$GITHUB_OUTPUT"
        echo "modules_dir=/lib/modules/${FULL_KERNEL_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Restore cached zram kernel module
      id: cache-zram
      uses: actions/cache/restore@v5
      with:
        path: proot/ci/termux/scripts/zram.ko.zst
        # See above section where FULL_KERNEL_VERSION is declared for why we need to use full kernel version for caching the builds
        key: ${{ steps.kernel-info.outputs.full_kernel_version }}-${{ hashFiles('proot/ci/termux/scripts/linux-kernel-signing-keys.gpg') }}-${{ hashFiles('.github/actions/zram/action.yml') }}

    - name: Build zram kernel module
      if: steps.cache-zram.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        KERNEL_VERSION=${{ steps.kernel-info.outputs.kernel_version }}
        TAR_KERNEL_VERSION=${{ steps.kernel-info.outputs.tar_version }}
        MODULES_DIR=${{ steps.kernel-info.outputs.modules_dir }}

        LINUX_CHECKOUT_DIR=$(mktemp -d)
        trap 'rm -rf "$LINUX_CHECKOUT_DIR"' EXIT
        cd "$LINUX_CHECKOUT_DIR"
        CURL_OPTS=(
          --fail
          --show-error
          --location
          --http1.1
          --retry 5
          --retry-all-errors
          --retry-delay 5
          --retry-max-time 600
          --connect-timeout 30
          --max-time 900
          --remote-name
        )
        curl "${CURL_OPTS[@]}" "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%\.*}.x/linux-${TAR_KERNEL_VERSION}.tar.xz"
        curl "${CURL_OPTS[@]}" "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%\.*}.x/linux-${TAR_KERNEL_VERSION}.tar.sign"

        gpg --import "${{ github.workspace }}/proot/ci/termux/scripts/linux-kernel-signing-keys.gpg"
        unxz "linux-${TAR_KERNEL_VERSION}.tar.xz"
        gpg --verify "linux-${TAR_KERNEL_VERSION}.tar.sign"
        tar --extract -f "linux-${TAR_KERNEL_VERSION}.tar"
        cd "linux-${TAR_KERNEL_VERSION}/"

        # We are basically doing a out-of-tree build for a module which is in-tree
        # See docs: https://www.kernel.org/doc/html/latest/kbuild/modules.html
        cd drivers/block/zram/
        make -C "${MODULES_DIR}/build/" M="$PWD" -j$(nproc)
        zstd zram.ko
        # Copy back compiled module into proot/ci/termux/scripts/ as actions/cache doesn't support absolute paths:
        # See https://github.com/actions/cache/issues/1540
        # Additionally restoring cache in /lib/modules/ would require running actions/cache/restore as root
        cp zram.ko.zst "${{ github.workspace }}/proot/ci/termux/scripts/"

    - name: Enable zram kernel module
      shell: bash
      run: |
        set -euo pipefail
        sudo cp proot/ci/termux/scripts/zram.ko.zst ${{ steps.kernel-info.outputs.modules_dir }}/kernel/
        sudo depmod
        sudo modprobe zram
        set +e
        sudo swapoff ${{ inputs.device_name }} || true
        sudo zramctl --reset ${{ inputs.device_name }} || true
        set -e
        sudo zramctl --find --algorithm ${{ inputs.algorithm }} --size ${{ inputs.size }}
        sudo mkswap -U clear ${{ inputs.device_name }}
        sudo swapon --discard --priority ${{ inputs.priority }} ${{ inputs.device_name }}

    - name: Save built zram kernel module
      if: steps.cache-zram.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: proot/ci/termux/scripts/zram.ko.zst
        key: ${{ steps.cache-zram.outputs.cache-primary-key }}
